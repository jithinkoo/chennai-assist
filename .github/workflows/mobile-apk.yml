# Builds the Chennai Assist Android app (mobile/) on every change and
# attaches the APK to the run: Actions tab -> latest run -> Artifacts.
name: Mobile app (Android APK)

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Signed with the debug key: fine for installing directly on phones.
      # For the Play Store, set up a release key (see mobile/README.md).
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: chennai-assist-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
