# Builds the Chennai Assist Android app (mobile/) on every change and
# attaches the APK to the run: Actions tab -> latest run -> Artifacts.
name: Mobile app (Android APK)

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the APK to Releases
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Signed with the debug key: fine for installing directly on phones.
      # For the Play Store, set up a release key (see mobile/README.md).
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: chennai-assist-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # Publish to GitHub Releases so there is one permanent, login-free link:
      # https://github.com/jithinkoo/chennai-assist/releases/latest/download/chennai-assist.apk
      - name: Publish APK to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk chennai-assist.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest chennai-assist.apk \
            --title "Chennai Assist Android app" \
            --notes "Latest Android build (commit ${GITHUB_SHA::7}). Download chennai-assist.apk on your Android phone and open it to install." \
            --latest
