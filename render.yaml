# Render Blueprint for Chennai Assist. The database is hosted on Neon
# (neon.tech); paste its connection string into DATABASE_URL when asked.
# In Render: New -> Blueprint -> pick this repo.
services:
  - type: web
    # The service name sets the address: jithin.onrender.com (if free).
    name: jithin
    runtime: elixir
    plan: free
    region: singapore
    buildCommand: ./build.sh
    startCommand: _build/prod/rel/chennai_assist/bin/start
    envVars:
      # Neon connection string, e.g.
      # postgresql://USER:PASSWORD@ep-xxxx.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: ELIXIR_VERSION
        value: 1.17.3
      - key: ERLANG_VERSION
        value: 26.2.5
      # Your admin login and the address that receives chat/question alerts.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Optional: free API key from brevo.com to send real emails.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
