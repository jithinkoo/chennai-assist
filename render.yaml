# Render Blueprint: creates the database and the web service in one go.
# In Render: New -> Blueprint -> pick this repo.
databases:
  - name: chennai-assist-db
    plan: free
    databaseName: chennai_assist
    user: chennai_assist

services:
  - type: web
    # The service name sets the address: jithin.onrender.com (if free).
    name: jithin
    runtime: elixir
    plan: free
    buildCommand: ./build.sh
    startCommand: _build/prod/rel/chennai_assist/bin/start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chennai-assist-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: ELIXIR_VERSION
        value: 1.17.3
      - key: ERLANG_VERSION
        value: 26.2.5
      # Your admin login and the address that receives chat/question alerts.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Optional: free API key from brevo.com to send real emails.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
